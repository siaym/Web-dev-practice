<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        h1{
            text-align: center;
        }
        .container{
            border: 3px solid rebeccapurple;
            display: flex;
            justify-content: center;
            height: 250px;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
        }
        .box{
            border: 2px dashed red;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div><h1>flexbox layout</h1></div>
    <div class="container">
        <div class="box">box-1</div>
        <div class="box">box-2</div>
        <div class="box">box-3</div>
        <div class="box">box-1</div>
        <div class="box">box-2</div>
        <div class="box">box-3</div>
        <div class="box">box-1</div>
        <div class="box">box-2</div>
        <div class="box">box-3</div>

    </div>
</body>
</html>
