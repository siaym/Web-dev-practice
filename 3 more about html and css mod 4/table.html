<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        td,th,caption{
            border: 1px solid black;
            padding: 10px;
        }
        table{
            border-collapse: collapse;
            width: 600px;
            margin: 0 auto;
            text-align: center;

        }
        
    </style>
</head>
<body>
    <main> 
        <table>
            <caption colspan="4"><h3>my friends</h3></caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>last name </th>
                <th>age</th>
            </tr>

        </thead>

        <tbody>
        <tr>
            <td>priya</td>
            <td>sharma</td>
            <td>24</td>
        </tr>
        <tr>
            <td>arun</td>
            <td>das</td>
            <td>22</td>
        </tr>
        <tr>
            <td>abir</td>
            <td>das</td>
            <td>25</td>
        </tr>
        </tbody>
        <tfoot>
            <td colspan="4">total friends 4 </td>
        </tfoot>
        </table>
    </main>
</body>
</html>
